[package]
name = "scrub-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
sha2 = "0.10"
blake2 = "0.10"
nix = { version = "0.29", features = ["fs"] }
rayon = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "scrub_rs"
path = "src/lib.rs"

[[bin]]
name = "scrub-rs"
path = "src/main.rs"

[[bin]]
name = "craft-corrupt"
path = "src/bin/craft_corrupt.rs"

[profile.release]
opt-level = 3
