name: Build unRAID Plugin

# Builds the scrub-rs + craft-corrupt binaries (gnu target, matching the
# integration tests and unRAID's glibc runtime) and packages them into the
# unRAID plugin .txz bundle. The Rust test suite lives in scrub-rs-tests.yml;
# this workflow is
# intentionally independent so a packaging change can't be blocked by the
# (slower) integration tests, but it runs the unit tests itself as a cheap
# gate before shipping.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    name: Build binaries + package plugin
    timeout-minutes: 30
    # contents: write is required so the tag-triggered release step can
    # publish the .txz bundle via the default GITHUB_TOKEN, regardless of
    # the repo's default workflow-permission setting.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Unit tests (cheap gate before packaging)
        run: |
          cd scrub-rs
          cargo test --release

      - name: Build scrub-rs (gnu)
        run: |
          cd scrub-rs
          cargo build --release
          ls -l target/release/scrub-rs \
                 target/release/craft-corrupt

      - name: Stage binaries into plugin tree
        run: |
          BIN_DIR="plugin/source/btrfs-integrity-recovery/usr/local/emhttp/plugins/btrfs-integrity-recovery/bin"
          mkdir -p "$BIN_DIR"
          cp scrub-rs/target/release/scrub-rs    "$BIN_DIR/"
          cp scrub-rs/target/release/craft-corrupt "$BIN_DIR/"
          chmod 755 "$BIN_DIR/scrub-rs" "$BIN_DIR/craft-corrupt"
          file "$BIN_DIR/scrub-rs"

      - name: Package bundle (.txz)
        run: |
          cd plugin/source/btrfs-integrity-recovery
          bash pkg_build.sh
          ls -l ../../archive/

      - name: Compute md5 and inject into .plg
        run: |
          VERSION=$(sed -n 's/.*<!ENTITY version[[:space:]]*"\([^"]*\)".*/\1/p' plugin/btrfs-integrity-recovery.plg | head -1)
          TXZ="plugin/archive/btrfs-integrity-recovery-${VERSION}-x86_64-1.txz"
          MD5=$(md5sum "$TXZ" | awk '{print $1}')
          echo "bundle: $TXZ"
          echo "bundle md5: $MD5"
          # No md5 is pinned in the .plg on purpose: the plg is served from
          # the main branch, but the bundle is only built when the release
          # tag is pushed, so its checksum is unknowable at commit time. (A
          # stale md5 in the committed plg would reject every download and
          # break updates.) Integrity is HTTPS + upgradepkg failing loudly
          # on a corrupt archive.
          echo "MD5=$MD5" >> "$GITHUB_ENV"

      - name: Verify release tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/.*<!ENTITY version[[:space:]]*"\([^"]*\)".*/\1/p' plugin/btrfs-integrity-recovery.plg | head -1)
          echo "plugin version: $VERSION"
          echo "release tag:    ${GITHUB_REF_NAME}"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match the .plg version (v${VERSION}); the .plg's bundleURL would 404"
            exit 1
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: btrfs-integrity-recovery-bundle
          path: plugin/archive/*.txz
          if-no-files-found: error

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/archive/*.txz
          # Auto-generate release notes from the conventional commits since
          # the last release. The asset is named after the .plg version
          # (pkg_build.sh derives it from the plg) and the verification step
          # above ensures the tag matches, so the .plg's bundleURL
          # (.../releases/download/v<version>/<versioned asset>) resolves.
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
