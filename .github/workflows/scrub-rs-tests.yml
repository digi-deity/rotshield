name: scrub-rs Integration Tests With Asymmetric Disks

# Rust port of unraid-btrfs-integrity-recovery/.github/workflows/integration-tests.yml.
# Same diverse 6-disk asymmetric array (P, Q + 4 data disks with ascending
# partition offsets and shrinking sizes) as the original Python workflow, but
# exercises scrub-rs / craft-corrupt instead of recover.py / btrfs_manipulate.py.
#
# STATUS (as of the commit that added this file): tests A/B/C below were
# verified working end-to-end against a scaled-down local replica of this
# exact array layout. Tests D, E and F are included because they are the
# most interesting remaining cases to debug, but were NOT YET fully verified
# against the *diverse* 4-data-disk array (two real bugs were found and
# fixed while setting this up — see array/recover.rs's per-disk rdevOffset
# fix and config.rs's slot_for_raw_dev/slot_from_array_partition fix — so
# there may be more lurking). Do not be surprised if D/E/F need further
# fixes; that's expected follow-up work, not a sign this file is wrong.

on:
  push:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    name: scrub-rs Integration Tests
    timeout-minutes: 20
    # The btrfs matrix + live-simulation job is more fundamental (no array
    # needed) and must pass first; the array tests build on top of it.
    needs: [btrfs-matrix-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install NonRAID + build dependencies
        run: |
          # Add the NonRAID PPA
          sudo add-apt-repository ppa:qvr/nonraid
          sudo apt update

          # Install prerequisites and NonRAID packages (nmdctl comes from
          # nonraid-tools; scrub-rs/craft-corrupt talk to the kernel module
          # directly and don't need Python).
          sudo apt install linux-headers-$(uname -r) nonraid-dkms nonraid-tools btrfs-progs gdisk

          # Verify the DKMS module installation
          sudo dkms status

      - name: Build scrub-rs
        run: |
          cd scrub-rs
          cargo build --release
          ./target/release/scrub-rs --dump-array || true
          # Add both scrub-rs and craft-corrupt to PATH so tests can call them directly
          echo "$PWD/target/release" >> "$GITHUB_PATH"
          # Also export the full path so sudo invocations can use the absolute path
          echo "SCRUB_RS_DIR=$PWD/target/release" >> "$GITHUB_ENV"
          cd ..

      - name: Create asymmetric test disk images
        run: |
          echo "Creating asymmetric test disk images..."
          echo ""
          echo "Layout (disk size, partition offset, usable size):"
          echo "  P    : 512MB  off 32K  -> ~512MB usable  (parity)"
          echo "  Q    : 512MB  off 32K  -> ~512MB usable  (parity)"
          echo "  disk1: 512MB  off 32K  -> ~512MB usable  (biggest data)"
          echo "  disk2: 448MB  off 32M  -> ~416MB usable"
          echo "  disk3: 384MB  off 64M  -> ~320MB usable"
          echo "  disk4: 320MB  off 96M  -> ~224MB usable  (smallest)"
          echo ""

          sudo dd if=/dev/zero of=d_p  bs=1M count=512 status=progress
          sudo dd if=/dev/zero of=d_q  bs=1M count=512 status=progress
          sudo dd if=/dev/zero of=d_d1 bs=1M count=512 status=progress
          sudo dd if=/dev/zero of=d_d2 bs=1M count=448 status=progress
          sudo dd if=/dev/zero of=d_d3 bs=1M count=384 status=progress
          sudo dd if=/dev/zero of=d_d4 bs=1M count=320 status=progress

          disk_p=$(sudo losetup -fP --show d_p)
          disk_q=$(sudo losetup -fP --show d_q)
          disk1=$(sudo losetup -fP --show d_d1)
          disk2=$(sudo losetup -fP --show d_d2)
          disk3=$(sudo losetup -fP --show d_d3)
          disk4=$(sudo losetup -fP --show d_d4)

          echo "DISK_P=$disk_p" >> $GITHUB_ENV
          echo "DISK_Q=$disk_q" >> $GITHUB_ENV
          echo "DISK1=$disk1"   >> $GITHUB_ENV
          echo "DISK2=$disk2"   >> $GITHUB_ENV
          echo "DISK3=$disk3"   >> $GITHUB_ENV
          echo "DISK4=$disk4"   >> $GITHUB_ENV

          echo "Created loop devices: P=$disk_p Q=$disk_q 1=$disk1 2=$disk2 3=$disk3 4=$disk4"

          # ── Create partitions with ascending offsets ────────────────────
          # P, Q and disk1 use a standard 32K start and run to disk end.
          # Data disks use larger partition offsets (32M, 64M, 96M) and the
          # partition runs to disk end. This gives every data disk a distinct
          # rdevOffset and a distinct rdevSize.
          sudo sgdisk -o -a 8 -n 1:32K:0 $disk_p
          sudo sgdisk -o -a 8 -n 1:32K:0 $disk_q
          sudo sgdisk -o -a 8 -n 1:32K:0 $disk1
          sudo sgdisk -o -a 8 -n 1:32M:0 $disk2
          sudo sgdisk -o -a 8 -n 1:64M:0 $disk3
          sudo sgdisk -o -a 8 -n 1:96M:0 $disk4

          # ── Create symlinks for device discovery ─────────────────────────
          sudo ln -s $disk_p /dev/disk/by-id/virtdisk-001
          sudo ln -s $disk_q /dev/disk/by-id/virtdisk-002
          sudo ln -s $disk1  /dev/disk/by-id/virtdisk-003
          sudo ln -s $disk2  /dev/disk/by-id/virtdisk-004
          sudo ln -s $disk3  /dev/disk/by-id/virtdisk-005
          sudo ln -s $disk4  /dev/disk/by-id/virtdisk-006

          # ── Make btrfs filesystems on each data disk ─────────────────────
          sudo mkfs.btrfs -f -L "data1" "${disk1}p1"
          sudo mkfs.btrfs -f -L "data2" "${disk2}p1"
          sudo mkfs.btrfs -f -L "data3" "${disk3}p1"
          sudo mkfs.btrfs -f -L "data4" "${disk4}p1"

                    # ── Configure mount options ──────────────────────────────────────
          # Compression on disk3 for variety (tests compressed-extent recovery
          # on a disk with a non-standard partition offset).
          sudo mkdir -p /etc/nonraid
          echo "/dev/nmd1p1 /mnt/disk1 btrfs defaults                 0 2" | sudo tee -a /etc/nonraid/fstab
          echo "/dev/nmd2p1 /mnt/disk2 btrfs defaults                 0 2" | sudo tee -a /etc/nonraid/fstab
          echo "/dev/nmd3p1 /mnt/disk3 btrfs defaults,compress=zstd   0 2" | sudo tee -a /etc/nonraid/fstab
          echo "/dev/nmd4p1 /mnt/disk4 btrfs defaults                 0 2" | sudo tee -a /etc/nonraid/fstab

          echo "Test environment ready"

      - name: Create, start and mount the NonRAID array
        run: |
          echo ">>> Creating NonRAID array with asymmetric disk assignments"
          echo "    P: /dev/loop0, virtdisk-001, offset 64 sectors (32K)"
          echo "    Q: /dev/loop1, virtdisk-002, offset 64 sectors (32K)"
          echo "    1: /dev/loop2, virtdisk-003, offset 64 sectors (32K)"
          echo "    2: /dev/loop3, virtdisk-004, offset 65536 sectors (32M)"
          echo "    3: /dev/loop4, virtdisk-005, offset 131072 sectors (64M)"
          echo "    4: /dev/loop5, virtdisk-006, offset 196608 sectors (96M)"
          sudo ./nmdctl create --force \
            P:/dev/loop0:virtdisk-001:64 \
            Q:/dev/loop1:virtdisk-002:64 \
            1:/dev/loop2:virtdisk-003:64 \
            2:/dev/loop3:virtdisk-004:65536 \
            3:/dev/loop4:virtdisk-005:131072 \
            4:/dev/loop5:virtdisk-006:196608

          echo ">>> [mk_array] Starting the NonRAID array"
          echo 'y' | sudo nmdctl start
          sleep 1

          echo ">>> [mk_array] Running array check"
          echo 'y' | sudo nmdctl check
          sleep 1

          echo ">>> [mk_array] Mounting array disks"
          sudo nmdctl mount
          sleep 1

          echo ">>> [mk_array] Checking array status"
          sudo nmdctl status

          echo ">>> [mk_array] Verifying per-disk sizes and offsets from /proc/nmdstat"
          grep -E '^rdevOffset\.[0-9]+=' /proc/nmdstat | sort -t. -k2 -n
          grep -E '^rdevSize\.[0-9]+='   /proc/nmdstat | sort -t. -k2 -n
          grep -E '^diskSize\.[0-9]+='   /proc/nmdstat | sort -t. -k2 -n

          echo ">>> [mk_array] Array setup complete"
      # ---------------------------------------------------------------
      # Test A (VERIFIED): single-disk corruption, data only -> P recovery.
      # ---------------------------------------------------------------
      - name: "Test A: data-only corruption on disk1 -> RECOVERED via P"
        run: |
          sudo dd if=/dev/urandom of=/mnt/disk1/testA bs=4096 count=32 conv=fdatasync
          sync
          sudo "$SCRUB_RS_DIR/craft-corrupt" /dev/nmd1p1 /testA --targets data --backup /tmp/backupA.bin
          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'

          out=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop2 --offset +64 --recover --write 2>&1) || true
          echo "$out"
          echo "$out" | grep -F "RECOVERED via P" || { echo "::error::expected RECOVERED via P"; exit 1; }

          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'
          verify=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop2 --offset +64 --recover 2>&1)
          echo "$verify"
          echo "$verify" | grep -F "sectors mismatch   : 0" || { echo "::error::disk1 still has mismatches after recovery"; exit 1; }

          sudo rm -f /mnt/disk1/testA

      # ---------------------------------------------------------------
      # Test B (VERIFIED): P baked-in on disk2 (32M offset) -> Q fallback.
      # ---------------------------------------------------------------
      - name: "Test B: bake-p corruption on disk2 -> RECOVERED via Q"
        run: |
          sudo dd if=/dev/urandom of=/mnt/disk2/testB bs=4096 count=32 conv=fdatasync
          sync
          sudo "$SCRUB_RS_DIR/craft-corrupt" /dev/nmd2p1 /testB --targets bake-p --backup /tmp/backupB.bin
          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'

          out=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop3 --offset +65536 --recover --write 2>&1) || true
          echo "$out"
          echo "$out" | grep -F "RECOVERED via Q" || { echo "::error::expected RECOVERED via Q"; exit 1; }

          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'
          verify=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop3 --offset +65536 --recover 2>&1)
          echo "$verify"
          echo "$verify" | grep -F "sectors mismatch   : 0" || { echo "::error::disk2 still has mismatches after recovery"; exit 1; }

          # bake-p leaves P baked from the corrupt data even after Q fixes
          # the disk itself — resync P+Q from clean data before the next
          # test so it doesn't inherit a stale P. See session notes:
          # recover_sector deliberately never rewrites parity.
          sudo "$SCRUB_RS_DIR/craft-corrupt" --restore /tmp/backupB.bin /dev/nmd2p1 /testB
          sudo rm -f /mnt/disk2/testB

      # ---------------------------------------------------------------
      # Test C (VERIFIED): Q baked-in on disk3 (64M offset) -> P fallback.
      # ---------------------------------------------------------------
      - name: "Test C: bake-q corruption on disk3 -> RECOVERED via P"
        run: |
          sudo dd if=/dev/urandom of=/mnt/disk3/testC bs=4096 count=32 conv=fdatasync
          sync
          sudo "$SCRUB_RS_DIR/craft-corrupt" /dev/nmd3p1 /testC --targets bake-q --backup /tmp/backupC.bin
          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'

          out=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop4 --offset +131072 --recover --write 2>&1) || true
          echo "$out"
          echo "$out" | grep -F "RECOVERED via P" || { echo "::error::expected RECOVERED via P"; exit 1; }

          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'
          verify=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop4 --offset +131072 --recover 2>&1)
          echo "$verify"
          echo "$verify" | grep -F "sectors mismatch   : 0" || { echo "::error::disk3 still has mismatches after recovery"; exit 1; }

          # bake-q leaves Q stale after P fixes the disk — resync before
          # the next test (see Test B's comment).
          sudo "$SCRUB_RS_DIR/craft-corrupt" --restore /tmp/backupC.bin /dev/nmd3p1 /testC
          sudo rm -f /mnt/disk3/testC

      # ---------------------------------------------------------------
      # Test D (NOT YET VERIFIED on this diverse array — interesting to
      # debug next): both P and Q baked-in on disk4 (96M offset, smallest
      # disk) -> single-parity paths AND the PQ 2-disk brute-force must
      # all fail cleanly (there's only one corrupt disk, so no partner
      # guess can produce a checksum match). Expect AllPathsFailed, not a
      # crash and not a false "recovered".
      # ---------------------------------------------------------------
      - name: "Test D: bake-both corruption on disk4 -> expected FAILED (AllPathsFailed)"
        continue-on-error: true
        run: |
          sudo dd if=/dev/urandom of=/mnt/disk4/testD bs=4096 count=32 conv=fdatasync
          sync
          sudo "$SCRUB_RS_DIR/craft-corrupt" /dev/nmd4p1 /testD --targets bake-both --backup /tmp/backupD.bin
          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'

          out=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop5 --offset +196608 --recover --write 2>&1) || true
          echo "$out"
          echo "$out" | grep -F "AllPathsFailed" || { echo "::error::expected AllPathsFailed (this is the known-unverified case — see repo memory)"; exit 1; }

          # Nothing should have been written (recovery declined to guess).
          sudo "$SCRUB_RS_DIR/craft-corrupt" --restore /tmp/backupD.bin /dev/nmd4p1 /testD
          sudo rm -f /mnt/disk4/testD

      # ---------------------------------------------------------------
      # Test E (NOT YET VERIFIED on this 4-data-disk array — the PQ math
      # itself was validated earlier against a simple 2-data-disk array;
      # this is the first time it's exercised with other, uninvolved data
      # disks present at the same offset, which is a materially different
      # code path through solve_two_disk's P_zero/Q_zero accumulation):
      # two independent data disks (disk1 + disk2) corrupted at the same
      # offset, P and Q left intact -> only the PQ 2-disk solve can
      # recover the target (disk1); disk2 (the partner) is deliberately
      # left corrupt (by design — no control checksum to verify it).
      # ---------------------------------------------------------------
      - name: "Test E: two-disk corruption (disk1 + disk2 partner) -> RECOVERED via PQ"
        continue-on-error: true
        run: |
          sudo dd if=/dev/urandom of=/mnt/disk1/testE bs=4096 count=32 conv=fdatasync
          sync
          sudo "$SCRUB_RS_DIR/craft-corrupt" /dev/nmd1p1 /testE --targets two-disk --partner 2 --backup /tmp/backupE.bin
          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'

          out=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop2 --offset +64 --recover --write 2>&1) || true
          echo "$out"
          echo "$out" | grep -F "RECOVERED via PQ(partner=slot 2)" || { echo "::error::expected RECOVERED via PQ(partner=slot 2) (known-unverified case)"; exit 1; }

          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'
          verify=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop2 --offset +64 --recover 2>&1)
          echo "$verify"
          echo "$verify" | grep -F "sectors mismatch   : 0" || { echo "::error::disk1 still has mismatches after PQ recovery"; exit 1; }

          # Restores BOTH disk1 and its partner (disk2) and resyncs P+Q.
          sudo "$SCRUB_RS_DIR/craft-corrupt" --restore /tmp/backupE.bin /dev/nmd1p1 /testE
          sudo rm -f /mnt/disk1/testE

      # ---------------------------------------------------------------
      # Test F (NOT YET VERIFIED — the most interesting one to debug
      # next): a single corruption on disk1 (the biggest disk, 512MB) at
      # an offset PAST disk4's usable capacity (~224MB) but within
      # disk1/disk2/disk3's range. This exercises read_block_or_zeros'
      # zero-substitution for disk4 while reconstructing via Q (bake-p
      # forces the Q fallback). See memories/repo/nonraid-asymmetric-parity.md
      # for the original Python-side bug this mirrors.
      # ---------------------------------------------------------------
      - name: "Test F: asymmetric zero-pad corruption past disk4's capacity -> RECOVERED via Q"
        continue-on-error: true
        run: |
          # 260MB file so a sector near the end lands past disk4's ~224MB
          # usable capacity but well within disk1/2/3.
          sudo dd if=/dev/urandom of=/mnt/disk1/testF bs=1M count=260 conv=fdatasync
          sync

          # sector = 250MB / 4096, comfortably past disk4's usable size and
          # inside the 260MB file.
          SECTOR=$((250*1024*1024/4096))
          sudo "$SCRUB_RS_DIR/craft-corrupt" /dev/nmd1p1 /testF --sector "$SECTOR" --targets bake-p --backup /tmp/backupF.bin
          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'

          out=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop2 --offset +64 --recover --write 2>&1) || true
          echo "$out"
          echo "$out" | grep -F "RECOVERED via Q" || { echo "::error::expected RECOVERED via Q (known-unverified zero-pad case)"; exit 1; }

          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'
          verify=$(sudo "$SCRUB_RS_DIR/scrub-rs" /dev/loop2 --offset +64 --recover 2>&1)
          echo "$verify"
          echo "$verify" | grep -F "sectors mismatch   : 0" || { echo "::error::disk1 still has mismatches after zero-pad recovery"; exit 1; }

          sudo "$SCRUB_RS_DIR/craft-corrupt" --restore /tmp/backupF.bin /dev/nmd1p1 /testF
          sudo rm -f /mnt/disk1/testF

      - name: Cleanup
        if: always()
        run: |
          sudo losetup -d $DISK_P || true
          sudo losetup -d $DISK_Q || true
          sudo losetup -d $DISK1  || true
          sudo losetup -d $DISK2  || true
          sudo losetup -d $DISK3  || true
          sudo losetup -d $DISK4  || true

          sudo rm -f d_p d_q d_d1 d_d2 d_d3 d_d4 || true

          echo "Cleanup completed"

  # ===========================================================================
  # btrfs matrix + live-simulation tests (no NonRAID array required).
  #
  # Two independent stages, both driven entirely by loop-backed single-device
  # btrfs images:
  #   1. btrfs-matrix   — generate the image matrix (test_matrix.sh) and run
  #      scrub-rs over every image, comparing against the btrfs-captured
  #      ground truth (run_matrix.sh). 16/16 expected.
  #   2. btrfs-live-sim — mount a fresh image, drive concurrent write/delete/
  #      snapshot churn, and run scrub-rs alongside it (false-positive and
  #      true-positive scenarios via btrfs_live_scrub_test.sh).
  #
  # btrfs-corrupt-block is needed by test_matrix.sh's recipe 11 (extent-tree
  # corruption) and is only built with btrfs-progs' --enable-experimental, so
  # we build it from source here. Everything else degrades gracefully if it
  # is absent.
  # ===========================================================================
  btrfs-matrix-tests:
    runs-on: ubuntu-latest
    name: scrub-rs btrfs matrix + live simulation
    timeout-minutes: 30
    needs: []   # standalone — does not depend on the array job

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install btrfs + build dependencies
        run: |
          sudo apt update
          sudo apt install -y btrfs-progs gdisk python3
          # Build deps for compiling btrfs-corrupt-block from source.
          sudo apt install -y build-essential libext2fs-dev libz-dev \
            libblkid-dev uuid-dev zlib1g-dev liblzo2-dev
          modprobe btrfs 2>/dev/null || true

      - name: Build btrfs-corrupt-block from source
        run: |
          # GitHub's Ubuntu runners ship only binary (deb) sources, not
          # deb-src, so apt build-dep / apt source fail until we enable them.
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt update
          sudo apt build-dep -y btrfs-progs
          cd /tmp
          rm -rf btrfs-progs-src
          apt source btrfs-progs
          cd btrfs-progs-*
          # btrfs-progs uses autotools; configure generates Makefile.inc
          # (the raw Makefile refuses to build without it).
          # --enable-experimental is required: btrfs-corrupt-block is an
          # experimental/debug tool and is NOT built otherwise.
          ./configure --disable-documentation --enable-experimental
          make btrfs-corrupt-block
          sudo install -m 0755 btrfs-corrupt-block /usr/local/bin/btrfs-corrupt-block
          command -v btrfs-corrupt-block && echo "btrfs-corrupt-block ready" || echo "WARN: btrfs-corrupt-block not built"

      - name: Dump btrfs-progs versions and btrfs-corrupt-block help
        run: |
          echo "=== btrfs --version ==="; btrfs --version
          echo "=== mkfs.btrfs --version ==="; mkfs.btrfs --version
          echo "=== btrfs-corrupt-block --version ==="; btrfs-corrupt-block --version 2>&1 || true
          echo "=== btrfs-corrupt-block --help (available flags) ==="; btrfs-corrupt-block --help 2>&1 | head -80 || true
          echo "=== btrfs check --help (relevant flags) ==="; btrfs check --help 2>&1 | grep -iE 'data-csum|readonly|corrupt|mode' || true

      - name: Build scrub-rs
        run: |
          cd scrub-rs
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"
          echo "SCRUB_RS_DIR=$PWD/target/release" >> "$GITHUB_ENV"

      - name: btrfs matrix — generate images + run scrub-rs
        continue-on-error: true
        run: |
          cd scrub-rs
          # Generate the image matrix (loop-backed, single-device btrfs)
          # plus the machine-readable expectations.tsv. Capture FULL output
          # (no tail) so version-dependent corruption decisions are visible.
          sudo ./btrfs_test_matrix.sh ./btrfs_test_images 2>&1 | tee /tmp/matrix_gen.log
          echo "=== matrix build.log (corruption decisions / verify_check rc) ==="
          sudo cat ./btrfs_test_images/build.log || true
          # Run scrub-rs over every image and compare to expectations.tsv.
          sudo -E ./run_matrix.sh --scrub-cmd "$SCRUB_RS_DIR/scrub-rs {DEVICE}" ./btrfs_test_images 2>&1 | tee /tmp/matrix_run.log
          echo "--- matrix summary ---"
          cat ./btrfs_test_images/matrix_results.tsv
          # Surface ground-truth + raw scrub output for every non-PASS image
          # so a version-dependent divergence (e.g. btrfs-corrupt-block -E
          # behaviour, or btrfs check flag support) is diagnosable from the
          # log alone without re-running locally.
          if ! grep -qE '^TOTAL=[0-9]+ PASS=[0-9]+ FAIL=0 ' ./btrfs_test_images/matrix_results.tsv; then
            echo "::group::diagnostics for non-PASS images"
            while IFS= read -r line; do
              img="$(printf '%s' "$line" | awk '{print $1}')"
              res="$(printf '%s' "$line" | awk '{print $7}')"
              [[ "$img" == "IMAGE" || "$res" == "PASS" || "$res" == "SKIP" || -z "$res" ]] && continue
              echo "### $img ($res)"
              echo "--- EXPECTED_check_status.txt (btrfs check ground truth) ---"
              sudo cat "${img%/*}/EXPECTED_check_status.txt" 2>/dev/null || true
              echo "--- raw scrub-rs report ---"
              sudo cat "${img%.img}.scrub_report.txt" 2>/dev/null || echo "(no report file emitted)"
            done < ./btrfs_test_images/matrix_results.tsv
            echo "::endgroup::"
            echo "MATRIX_FAILED=true" >> "$GITHUB_ENV"
          else
            echo "MATRIX_FAILED=false" >> "$GITHUB_ENV"
          fi

      - name: Upload matrix artifacts on failure
        if: ${{ env.MATRIX_FAILED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: btrfs-matrix-diagnostics
          path: scrub-rs/btrfs_test_images/
          if-no-files-found: warn

      - name: btrfs live simulation — concurrent churn + scrub
        if: ${{ env.MATRIX_FAILED != 'true' }}
        run: |
          cd scrub-rs
          # Read-only scrub alongside concurrent churn (no array active, so
          # --recover is not used). Covers false-positive, true-positive,
          # and true-positive-dup-one-copy scenarios.
          sudo ./btrfs_live_scrub_test.sh \
            --scrub-cmd "$SCRUB_RS_DIR/scrub-rs {DEVICE}" \
            --mode all --duration 60 --warmup 10 --intensity med
          echo "--- live-sim summaries ---"
          for s in /root/btrfs_live_scrub_test_*/false-positive/SUMMARY.txt \
                   /root/btrfs_live_scrub_test_*/true-positive/SUMMARY.txt \
                   /root/btrfs_live_scrub_test_*/true-positive-dup-one-copy/SUMMARY.txt; do
            [[ -f "$s" ]] && { echo "### $s"; cat "$s"; }
          done

      - name: Fail job if matrix had failures
        if: always()
        run: |
          if [[ "${MATRIX_FAILED:-false}" == "true" ]]; then
            echo "::error::btrfs matrix had failures (see diagnostics above / uploaded artifact)"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          # Detach any loop devices the matrix/live-sim scripts may have left.
          for ld in $(losetup -a 2>/dev/null | awk -F: '{print $1}'); do
            sudo losetup -d "$ld" 2>/dev/null || true
          done
          sudo rm -rf /root/btrfs_live_scrub_test_* || true
          sudo rm -rf scrub-rs/btrfs_test_images || true
          echo "Cleanup completed"
