name: NonRAID Integration Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:


jobs:
  integration-test:
    runs-on: ubuntu-latest
    name: NonRAID Integration Tests
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Add the NonRAID PPA
          sudo add-apt-repository ppa:qvr/nonraid
          sudo apt update

          # Install prerequisites and NonRAID packages
          sudo apt install linux-headers-$(uname -r) nonraid-dkms nonraid-tools python3-pip

          # Verify the DKMS module installation
          sudo dkms status

          # Install crc32c for checksum verification
          sudo -H pip3 install crc32c construct construct-typing intervaltree loguru

      - name: Create test environment
        run: |
          echo "Creating test disk images..."

          # Create test disk images
          sudo dd if=/dev/zero of=d1 bs=1M count=256 status=progress
          sudo dd if=/dev/zero of=d2 bs=1M count=256 status=progress
          sudo dd if=/dev/zero of=d3 bs=1M count=256 status=progress
          sudo dd if=/dev/zero of=d4 bs=1M count=256 status=progress

          # Set up loop devices
          disk1=$(sudo losetup -fP --show d1)
          disk2=$(sudo losetup -fP --show d2)
          disk3=$(sudo losetup -fP --show d3)
          disk4=$(sudo losetup -fP --show d4)

          echo "DISK1=$disk1" >> $GITHUB_ENV
          echo "DISK2=$disk2" >> $GITHUB_ENV
          echo "DISK3=$disk3" >> $GITHUB_ENV
          echo "DISK4=$disk4" >> $GITHUB_ENV

          echo "Created loop devices: $disk1, $disk2, $disk3, $disk4"

          # Create partitions
          sudo sgdisk -o -a 8 -n 1:32K:0 $disk1
          sudo sgdisk -o -a 8 -n 1:32K:0 $disk2
          sudo sgdisk -o -a 8 -n 1:32K:0 $disk3
          sudo sgdisk -o -a 8 -n 1:32K:0 $disk4

          # Create symlinks for device discovery
          sudo ln -s $disk1 /dev/disk/by-id/virtdisk-001
          sudo ln -s $disk2 /dev/disk/by-id/virtdisk-002
          sudo ln -s $disk3 /dev/disk/by-id/virtdisk-003
          sudo ln -s $disk4 /dev/disk/by-id/virtdisk-004

          # Make btrfs filesystems
          sudo mkfs.btrfs -f -L "data3" "${disk3}p1"
          sudo mkfs.btrfs -f -L "data4" "${disk4}p1"

          # Enable compression on the 4th disk (maps to 2nd disk in NonRAID array due to parity disks)
          sudo mkdir -p /etc/nonraid
          echo "/dev/nmd4p1 /mnt/disk2 btrfs defaults,compress=zstd 0 2" | sudo tee -a /etc/nonraid/fstab

          echo "Test environment ready"

      - name: Test NonRAID array operations
        run: |
          echo ">>> [mk_array] Creating NonRAID array with disk assignments"
          sudo ./nmdctl create --force P:/dev/loop0p1:virtdisk-001 Q:/dev/loop1p1:virtdisk-002 1:/dev/loop2p1:virtdisk-003 2:/dev/loop3p1:virtdisk-004

          echo ">>> [mk_array] Starting the NonRAID array"
          echo 'y' | sudo nmdctl start
          sleep 1

          echo ">>> [mk_array] Running array check"
          echo 'y' | sudo nmdctl check
          sleep 1

          echo ">>> [mk_array] Mounting array disks"
          sudo nmdctl mount
          sleep 1

          echo ">>> [mk_array] Checking array status"
          sudo nmdctl status

          echo ">>> [mk_array] Array setup complete"

          echo "Array operations completed successfully"

      - name: Recovery test - single corruption detailed flow
        run: |
          # 1. Induce error
          sudo python3 btrfs_manipulate.py /mnt/disk1/file1 --size-mb 50

          # 2. Initial scrub to detect error
          sudo btrfs scrub start /mnt/disk1
          echo ">>> [scrub] Initial scrub started, waiting for completion..."
          while true; do
            status=$(sudo btrfs scrub status /mnt/disk1)
            if echo "$status" | grep -q "finished"; then
              echo "$status"
              break
            fi
            sleep 1
          done

          # 3. Run recovery
          sudo python3 recover.py

          # 4. Final scrub to confirm recovery
          echo ">>> [scrub] Final verification scrub started..."
          sudo btrfs scrub start /mnt/disk1
          while true; do
            status=$(sudo btrfs scrub status /mnt/disk1)
            if echo "$status" | grep -q "finished"; then
              echo "$status"
              break
            fi
            sleep 1
          done
          sudo rm -rf /mnt/disk1/file1
          sudo dmesg -c > /dev/null
      - name: Recovery test - multiple corruptions
        run: |
          # 1. Inject many equally spaced corruptions in one scrub window in a single file on disk1.
          sudo bash multi_corruptions_test.sh

          # 2. Initial scrub to detect all injected errors.
          sudo btrfs scrub start /mnt/disk1
          echo ">>> [scrub] Initial multi-corruption scrub started, waiting for completion..."
          while true; do
            status=$(sudo btrfs scrub status /mnt/disk1)
            if echo "$status" | grep -q "finished"; then
              echo "$status"
              break
            fi
            sleep 1
          done

          # 3. Recover all discovered checksum failures.
          sudo python3 recover.py

          # 4. Final scrub to confirm clean state after recovery.
          echo ">>> [scrub] Final multi-corruption verification scrub started..."
          sudo btrfs scrub start /mnt/disk1
          while true; do
            status=$(sudo btrfs scrub status /mnt/disk1)
            if echo "$status" | grep -q "finished"; then
              echo "$status"
              break
            fi
            sleep 1
          done
          sudo rm -rf /mnt/disk1/file1
          sudo dmesg -c > /dev/null
      - name: Recovery test - corruption with file deletion
        run: |
          # 1. Create and corrupt two files
          sudo python3 btrfs_manipulate.py /mnt/disk1/file_a --size-mb 10
          sudo python3 btrfs_manipulate.py /mnt/disk1/file_b --size-mb 10

          # 2. Initial scrub to detect remaining error
          sudo btrfs scrub start /mnt/disk1
          echo ">>> [scrub] Initial scrub started, waiting for completion..."
          while true; do
            status=$(sudo btrfs scrub status /mnt/disk1)
            if echo "$status" | grep -q "finished"; then
              echo "$status"
              break
            fi
            sleep 1
          done

          # 3. Delete one of the corrupted files
          sudo rm /mnt/disk1/file_a
          sudo sync

          # 4. Run recovery
          sudo python3 recover.py

          # 5. Final scrub to confirm recovery
          echo ">>> [scrub] Final verification scrub started..."
          sudo btrfs scrub start /mnt/disk1
          while true; do
            status=$(sudo btrfs scrub status /mnt/disk1)
            if echo "$status" | grep -q "finished"; then
              echo "$status"
              break
            fi
            sleep 1
          done
      - name: Cleanup
        if: always()
        run: |
          # Stop NonRAID array
          sudo nmdctl -u umount || true
          sudo nmdctl -u stop || true

          # Unload modules
          sudo modprobe -r md_nonraid || true
          sudo modprobe -r nonraid6_pq || true

          # Clean up loop devices
          sudo losetup -d $DISK1 || true
          sudo losetup -d $DISK2 || true
          sudo losetup -d $DISK3 || true
          sudo losetup -d $DISK4 || true

          # Remove test files
          sudo rm -f file1 || true
          sudo rm -f d1 d2 d3 d4 || true

          echo "Cleanup completed"